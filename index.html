<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <title>Bài tập Thiết kế Web - Hà Đình Sáng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f2f5;
      color: #212529;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .menu-box {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 28px 24px;
      text-align: center;
    }

    .menu-box h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 14px;
      color: #57606f;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      background-color: #1e90ff;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
    }

    .btn:hover {
      background-color: #187bcd;
    }
  </style>
</head>
<body>
  <div class="menu-box">
