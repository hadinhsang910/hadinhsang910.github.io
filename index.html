    body {

      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: #ffffff;
      padding: 32px 28px;
      border-radius: 10px;
      border: 1px solid #d0d7de;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      color: #111827;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      margin: 0 0 24px;
    }
    a {
      display: block;
      padding: 13px 16px;
      margin-bottom: 12px;
      background-color: #1e90ff;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 15px;
    }
    a:hover {
      background-color: #187bcd;
    }
  </style>
</head>
